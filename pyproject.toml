[build-system]
requires = ["setuptools>=77",
            "setuptools_scm[toml]>=7",
            "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "g2client"
description = "A client for observing with the Subaru Telescope Observation Control System."
readme = {file = "README.md", content-type = "text/markdown"}
authors = [{name = "Software Division, Subaru Telescope, NAOJ", email = "ocs@naoj.org"}]
license = "BSD-3-Clause"
license-files = ["LICENSE.md"]
keywords = ["subaru", "telescope", "observation", "client"]
requires-python = ">=3.11"
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/naojsoft/g2client"

[tool.setuptools]
zip-safe = false
# gen2_play is in scripts/ and deliberately not installed, as it was not in
# setup.cfg's list either.
script-files = [
    "scripts/soundsink",
    "scripts/g2disp",
    "scripts/g2disp_gui",
]

[tool.setuptools.packages.find]
include = ["g2client*"]
namespaces = false

[tool.setuptools.package-data]
g2client = ["icons/*.png"]

[tool.setuptools_scm]
write_to = "g2client/version.py"
version_scheme = "release-branch-semver"

[tool.ruff]
# scripts/ are Python but carry no .py suffix, so ruff would not glob them.
# target-version matches requires-python above; keep them together.
target-version = "py311"
# build/ and tmp/ hold stale copies of modules that live in g2client/, and
# version.py is generated by setuptools_scm.
extend-exclude = ["build", "tmp", "g2client/version.py"]
extend-include = ["scripts/g2disp",
                  "scripts/g2disp_gui",
                  "scripts/gen2_play",
                  "scripts/soundsink"]

[tool.ruff.lint]
# pycodestyle (E/W) + pyflakes (F), the same coverage as the rest of the
# Gen2 repositories
select = ["E", "F", "W"]
ignore = [
    "E265",  # block comment should start with '# '
    "E266",  # too many leading '#' for block comment
    "E402",  # module level import not at top of file
    "E501",  # line too long
    "E741",  # ambiguous variable name 'l'
]
